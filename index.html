<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moenda Café</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #F4F4F2; color: #222; padding: 16px; box-sizing: border-box; }
  p { margin: 0; }
</style>
<script>
  /* Sorteia a versão do site (A ou B) para cada participante.
     - O sorteio fica guardado no navegador, então quem recarregar
       a página continua na mesma versão.
     - Para forçar uma versão, use ?v=a ou ?v=b no endereço. */
  (function () {
    var v = (new URLSearchParams(location.search).get("v") || "").toLowerCase();
    if (v !== "a" && v !== "b") {
      try { v = localStorage.getItem("moenda-versao") || ""; } catch (e) {}
    }
    if (v !== "a" && v !== "b") v = Math.random() < 0.5 ? "a" : "b";
    try { localStorage.setItem("moenda-versao", v); } catch (e) {}
    location.replace(v + "/");
  })();
</script>
</head>
<body>
  <p>Abrindo o site da Moenda Café…</p>
  <noscript><p><a href="a/">Abrir o site</a></p></noscript>
</body>
</html>
